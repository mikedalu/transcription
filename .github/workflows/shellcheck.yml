name: Shell checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: bash -n install.sh transcribe.sh cleanup.sh

      - name: ShellCheck
        run: shellcheck install.sh transcribe.sh cleanup.sh
